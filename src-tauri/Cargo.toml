[package]
name = "nodus"
version = "1.6.0-rc.4"
description = "Visual knowledge graph for thinking and research"
authors = ["Nodus Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# File watching
notify = "6.0"
fs2 = "0.4"

# PDF extraction
pdf-extract = "0.12"
lopdf = "0.44"

# RDF/Ontology parsing
rio_api = "0.8"
rio_turtle = "0.8"
rio_xml = "0.8"
oxiri = "0.2"

# WebSocket server for MCP
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
walkdir = "2.4"
hex = "0.4"
regex = "1.10"
urlencoding = "2.1"
html-escape = "0.2"

# Typst for math rendering
typst = "0.12"
typst-svg = "0.12"
typst-assets = { version = "0.12", features = ["fonts"] }
comemo = "0.4"
once_cell = "1.19"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Linux only: the touchpad pinch is consumed at the GTK widget before WebKit
# receives it. WebKit's own pinch handling changes the viewport page-scale,
# which is internal - it is not the zoom-level property and not a DOM default
# action, so neither JavaScript nor webkit2gtk can undo it (main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
webkit2gtk = "2.0"
