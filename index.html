<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no disable pinch-to-zoom page scaling.
         A touchpad pinch drives WebKit's viewport page-scale factor, which is a
         different mechanism from the zoom-level property that Ctrl+/- uses, and
         it is not a DOM default action - so no JavaScript listener can prevent
         it. Left enabled it scaled the whole interface until the toolbar and the
         canvas controls sat outside the window, with no way to undo it. Zooming
         on this canvas is the canvas's own gesture, not the page's. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nodus</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* The application interprets touch and pen gestures itself; without
           this the webview claims pinch and pan for its own scrolling first */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
