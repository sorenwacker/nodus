name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Validate R2 credentials before building (for full releases)
  validate-r2:
    name: Validate R2 Credentials
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Test R2 connection
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://78836246513c4e18ead5fd9349aea200.r2.cloudflarestorage.com
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone lsd r2:binaries --max-depth 1
          echo "R2 credentials valid"

  # Run tests first - release only proceeds if tests pass
  test:
    name: Tests
    runs-on: ubuntu-latest
    outputs:
      # This tag's CHANGELOG section, used as the release body
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          # Compare the FULL tag (including any -rc.N suffix) against the
          # manifests: manifests carry the exact release version, so stripping
          # the pre-release suffix made every rc tag fail its own check
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "Tag version: $TAG"
          echo "package.json: $PKG_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"

          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag ($TAG) doesn't match Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "All versions match!"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --verbose
        working-directory: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      # Extracted here (one Linux runner) rather than per platform, so the
      # three release jobs publish an identical body
      - name: Build release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            ./scripts/release-notes.sh "${{ github.ref_name }}"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    name: Release (${{ matrix.platform }})
    needs: [test, validate-r2]
    if: ${{ always() && needs.test.result == 'success' && (needs.validate-r2.result == 'success' || needs.validate-r2.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifacts are signed here; without these secrets the build
          # still succeeds but produces no .sig files, and the manifest step
          # below will say so rather than publishing an unusable manifest
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Distribution signing is added when the Apple certificate exists.
          # Declaring the APPLE_* variables while the secrets are unset makes
          # tauri-action attempt a certificate import and fail the macOS build,
          # so they are added with the certificate, not ahead of it. See
          # docs/content/development.md > Release signing.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nodus ${{ github.ref_name }}'
          # This version's CHANGELOG section, extracted once in the test job
          releaseBody: ${{ needs.test.outputs.notes }}
          # Publish straight away: a draft only reaches users if someone
          # remembers to press publish, which stranded six past versions
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}


  # Upload release assets to R2 (full releases only)
  upload-r2:
    needs: release
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir assets

      - name: Upload to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://78836246513c4e18ead5fd9349aea200.r2.cloudflarestorage.com
        run: |
          curl -s https://rclone.org/install.sh | sudo bash

          # Generate index.html
          cat > assets/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><title>Nodus Downloads</title>
          <style>body{font-family:system-ui;max-width:800px;margin:2rem auto;padding:1rem}
          a{display:block;padding:0.5rem 0}</style></head>
          <body><h1>Nodus Downloads</h1>
          EOF
          for f in assets/*; do
            [ -f "$f" ] && echo "<a href=\"$(basename "$f")\">$(basename "$f")</a>" >> assets/index.html
          done
          echo "</body></html>" >> assets/index.html

          # Generate latest.yml for version tracking
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_URL="https://pub-99aa2887ef464cdeac1ab7be9b4fa860.r2.dev/nodus"
          cat > assets/latest.yml << EOF
          version: $VERSION
          date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          files:
            - name: Nodus_${VERSION}_universal.dmg
              platform: darwin
            - name: Nodus_${VERSION}_x64-setup.exe
              platform: win32
            - name: Nodus_${VERSION}_amd64.deb
              platform: linux
          EOF

          # The manifest the installed application polls. Each platform entry
          # carries the detached signature tauri-action produced; the updater
          # refuses a payload whose signature does not verify, so a manifest
          # without signatures is worse than none and is skipped instead.
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="See https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"

          sig() {
            local file="assets/$1"
            [ -f "$file.sig" ] && cat "$file.sig" || echo ""
          }

          MAC_SIG=$(sig "Nodus_universal.app.tar.gz")
          WIN_SIG=$(sig "Nodus_${VERSION}_x64-setup.exe")
          LINUX_SIG=$(sig "Nodus_${VERSION}_amd64.AppImage")

          if [ -z "$MAC_SIG" ] && [ -z "$WIN_SIG" ] && [ -z "$LINUX_SIG" ]; then
            echo "::warning::No updater signatures found - skipping latest.json. Set TAURI_SIGNING_PRIVATE_KEY to enable auto-update."
          else
            cat > assets/latest.json << EOF
          {
            "version": "$VERSION",
            "notes": "$NOTES",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "$BASE_URL/Nodus_universal.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$BASE_URL/Nodus_universal.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$BASE_URL/Nodus_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$BASE_URL/Nodus_${VERSION}_amd64.AppImage"
              }
            }
          }
          EOF
          fi

          rclone copy assets/ r2:binaries/nodus/

  # Cleanup old versions from R2 (keep last 5)
  cleanup-r2:
    needs: upload-r2
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old versions
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://78836246513c4e18ead5fd9349aea200.r2.cloudflarestorage.com
        run: |
          curl -s https://rclone.org/install.sh | sudo bash

          # List all versioned files, extract versions, sort, keep only versions to delete
          KEEP_VERSIONS=5

          # Get unique version numbers from filenames (e.g., Nodus_0.4.35_xxx -> 0.4.35)
          rclone ls r2:binaries/nodus/ | awk '{print $2}' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | uniq > all_versions.txt

          TOTAL=$(wc -l < all_versions.txt)
          if [ "$TOTAL" -gt "$KEEP_VERSIONS" ]; then
            DELETE_COUNT=$((TOTAL - KEEP_VERSIONS))
            head -n "$DELETE_COUNT" all_versions.txt > versions_to_delete.txt

            echo "Keeping last $KEEP_VERSIONS versions, deleting $DELETE_COUNT old versions:"
            cat versions_to_delete.txt

            while read -r VERSION; do
              echo "Deleting files for version $VERSION..."
              rclone delete r2:binaries/nodus/ --include "*${VERSION}*"
            done < versions_to_delete.txt
          else
            echo "Only $TOTAL versions found, keeping all (threshold: $KEEP_VERSIONS)"
          fi

  # Trigger website to update download links
  trigger-website:
    needs: [upload-r2, cleanup-r2]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sorenwacker.net update
        env:
          PAT_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_TOKEN" \
            https://api.github.com/repos/sorenwacker/sorenwacker.net/dispatches \
            -d '{"event_type":"nodus-release","client_payload":{"version":"${{ github.ref_name }}"}}'
