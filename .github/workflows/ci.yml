name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        # The runner's Azure apt mirror is sometimes unreachable and apt then
        # trickles for ten minutes before failing; retry, and let apt retry
        # each fetch, instead of hanging the job
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install -y -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev && break
            echo "apt attempt $attempt failed, retrying" && sleep 20
          done
          dpkg -s libwebkit2gtk-4.1-dev > /dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci
        working-directory: .

      - name: Build frontend
        run: npm run build
        working-directory: .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose

      # The npm Tauri packages and the Rust crates must stay on the same
      # minor versions. Only `tauri build` checks that, and only the release
      # workflow ran it, so a dependency bump could break every release build
      # without any CI job failing. The frontend was built above, so the
      # beforeBuildCommand is skipped.
      - name: Check Tauri build
        run: npx tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
        working-directory: .

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        # --all-targets so test code is linted too: without it a clippy error
        # in a test file passes every gate and reaches main
        run: cargo clippy --all-targets -- -D warnings

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      # Nothing enforced this before, which is how 83 type errors accumulated
      - name: Typecheck
        run: npm run typecheck

  mcp-server:
    name: MCP Server Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/nodus-mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/nodus-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc type-checks index.ts and websocket-client.ts, which the root
      # suite never imports, so nothing else checks them
      - name: Build
        run: npm run build
